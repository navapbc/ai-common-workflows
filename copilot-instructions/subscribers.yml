# Repositories subscribed to AI-review Copilot instruction updates.
#
# To subscribe: open a PR adding an entry below. Each entry is either a bare
# "owner/repo" string (which uses the default cms-ars profile) or an object with
# an explicit profile:
#
#   subscribers:
#     - navapbc/example-service                    # uses profile: cms-ars
#     - repo: navapbc/another-service
#       profile: baseline                          # generic security baseline
#
# The profile selects which instruction set is distributed, from
# copilot-instructions/profiles/<profile>/instructions/. When those files
# change, a bot opens a PR against each subscriber that copies the latest
# ai-review-*.instructions.md into .github/instructions/ — you review and merge
# it like any other PR. The bot never pushes directly.
#
# The distributing account (a GitHub App or a PAT — see docs/copilot-instructions.md)
# must be installed on / have write access to each repo listed here.
subscribers: []
  # - navapbc/example-service
  # - repo: navapbc/another-service
  #   profile: baseline
