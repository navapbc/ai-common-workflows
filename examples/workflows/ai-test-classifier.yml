# Minimal AI test classifier — Claude on the public Anthropic API.
#
# Copy this file into .github/workflows/ in your repository. The `@v1` alias
# points to the newest stable 1.x release. Corrections come to your repository
# automatically. To use a reference that does not change, replace `@v1` with a
# 40-character commit SHA or a vX.Y.Z tag. Then record the release in a comment
# at the end of the line. Refer to docs/security.md.
#
# By default the agent RUNS the PR's test suite on the runner (OBSERVED mode)
# — that is executing the PR's code. Keep the `pull_request` trigger (never
# pull_request_target); for public repos with untrusted forks, set
# `run-suite: false` for a read-only pass that predicts from the diff.
#
# Run it in parallel with your build — no `needs:`. It is advisory and never
# gates the build unless you opt in with `gate: true`.
name: AI test classifier
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    # Installing deps + running a suite is slower than a diff-only review;
    # bound the job so a stuck install can't run for the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: navapbc/ai-common-workflows/workflows/test-classifier@v1 # or pin a 40-char SHA; see docs/security.md
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
