# Minimal AI PR review — Claude on the public Anthropic API, sandboxed.
#
# Copy this into .github/workflows/ in your repository. Pin the action to a
# full commit SHA (see docs/security.md); the "# v1.0.0" comment records which
# release that SHA is, so upgrades are a deliberate, reviewable change.
name: AI PR review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: navapbc/ai-reusable-workflows@REPLACE_WITH_COMMIT_SHA # v1.0.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
