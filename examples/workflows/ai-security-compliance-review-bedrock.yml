# AI security & compliance review against Amazon Bedrock — no code or diff leaves your AWS boundary.
#
# Because the LLM is in-boundary, the review compute should be too. GitHub-hosted
# runners execute the checkout and diff on GitHub's shared infrastructure — if
# that is outside your accreditation boundary, run this on a self-hosted runner
# or an AWS CodeBuild-backed runner in your VPC instead (change `runs-on`), where
# Bedrock is reachable over a VPC endpoint. See docs/private-endpoints.md.
name: AI security & compliance review (Bedrock)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write # for OIDC role assumption

# One review per PR. A new push supersedes an in-flight run rather than racing
# it: each run is a real model call you pay for, and two of them would post
# overlapping comments.
concurrency:
  group: ai-security-compliance-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest # ← consider [self-hosted, linux, x64] inside your VPC
    # A review of a large diff runs ~8 minutes; GitHub's default job
    # timeout is six hours, which is a long time for a hung CLI to hold a
    # runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the token out of .git/config so the AI phase cannot reach a
          # repo-write credential. The action posts in a separate step that
          # holds the token. See docs/security.md.
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/ai-security-compliance-review
          aws-region: us-east-1

      - uses: navapbc/ai-common-workflows/workflows/security-compliance-review@REPLACE_WITH_COMMIT_SHA # v1.0.0
        with:
          ai-tool: claude
          provider: bedrock
          aws-region: us-east-1
          model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
