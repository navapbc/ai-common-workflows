# AI PR review as a required check — fail the job on any finding.
#
# `gate: true` makes a non-APPROVE result exit non-zero, so this job can be a
# required status check in branch protection. Use deliberately: the review is
# advisory by default because findings are second-opinion signal, not a
# guaranteed-correct gate.
name: AI PR review (gating)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: navapbc/ai-common-workflows/workflows/security-compliance-review@v1 # or pin a 40-char SHA; see docs/security.md
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          gate: true
          # Stronger second opinion before failing a build:
          adjudication: independent
