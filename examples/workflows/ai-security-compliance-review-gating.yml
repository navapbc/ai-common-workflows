# AI security & compliance review as a required check.
#
# `gate: true` fails the job on HIGH or CRITICAL findings, so this job can be a
# required status check in branch protection. Use deliberately: the review is
# advisory by default because findings are second-opinion signal, not a
# guaranteed-correct gate.
#
# MEDIUM and LOW still post as inline comments — gating changes what fails the
# build, never what gets reported.
name: AI security & compliance review (gating)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One review per PR. A new push supersedes an in-flight run rather than racing
# it: each run is a real model call you pay for, and two of them would post
# overlapping comments.
concurrency:
  group: ai-security-compliance-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # A review of a large diff runs ~8 minutes; GitHub's default job
    # timeout is six hours, which is a long time for a hung CLI to hold a
    # runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the token out of .git/config so the AI phase cannot reach a
          # repo-write credential. The action posts in a separate step that
          # holds the token. See docs/security.md.
          persist-credentials: false
      - uses: navapbc/ai-common-workflows/workflows/security-compliance-review@REPLACE_WITH_COMMIT_SHA # v1.0.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fail on HIGH and CRITICAL; MEDIUM and LOW still post as comments.
          gate: true
          # Adjudication is off by default: a current model re-checks its own
          # work unprompted, and on the detection corpus `self` suppressed
          # nothing while costing tokens. Gating is the one case where paying
          # for a second opinion may still be worth it, since a false positive
          # fails someone's build — but `independent` roughly doubles cost on
          # finding-bearing PRs and has not been measured here. Opt in
          # deliberately, and check it against your own code first:
          #   adjudication: independent
