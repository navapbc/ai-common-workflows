# AI security & compliance review as a required check.
#
# `gate` is the severity at which the job fails: off (default) | critical |
# high | any. Anything but `off` makes this job usable as a required status
# check in branch protection. Use deliberately: the review is advisory by
# default because findings are second-opinion signal, not a guaranteed-correct
# gate.
#
# `high` is the usual first gate. `any` fails on a single LOW finding, which
# most teams cannot live with as a required check. Findings below the gate
# still post as inline comments — `gate` changes what fails the build, never
# what gets reported.
name: AI security & compliance review (gating)
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: navapbc/ai-common-workflows/workflows/security-compliance-review@REPLACE_WITH_COMMIT_SHA # v1.0.0
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Fail on HIGH and CRITICAL; MEDIUM and LOW still post as comments.
          gate: high
          # Stronger second opinion before failing a build:
          adjudication: independent
