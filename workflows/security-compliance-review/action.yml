name: "AI Security & Compliance Review"
description: >-
  AI-assisted security and compliance review of a pull request. Supports
  Claude, Codex, and Copilot, on the public API or a private endpoint
  (Bedrock, Vertex, Azure OpenAI, or a custom gateway). Selectable compliance
  profile (`base` by default).
author: "Nava PBC"

branding:
  icon: "shield"
  color: "purple"

inputs:
  ai-tool:
    description: "Which AI CLI to use: claude | codex | copilot."
    required: false
    default: "claude"
  anthropic-api-key:
    description: "Anthropic API key (ai-tool=claude, provider=api)."
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API key (ai-tool=codex)."
    required: false
    default: ""
  github-token:
    description: >-
      Token used to post the review. Needs 'pull-requests: write'. Defaults to
      the workflow token.
    required: false
    default: ${{ github.token }}

  post-comments:
    description: "Post the review with inline comments to the PR."
    required: false
    default: "true"
  post-when-clean:
    description: >-
      Post a review even when there are no findings (default false). The job's
      own check already shows the review ran, so the default stays silent on a
      clean PR rather than notifying every subscriber to say nothing happened.
      Turn it on if you want the approval visible on the PR itself — a
      compliance program wanting durable evidence per PR, say. Findings always
      post either way, and a review asking for changes always posts.
    required: false
    default: "false"
  max-comments:
    description: >-
      Limit on inline comments per review (default 50; 0 = no limit). Over the
      limit the highest-severity findings stay inline and the rest are listed
      in the review body, under a heading saying the limit was reached — so a
      reader can tell the inline comments are not the whole review. Nothing is
      dropped and the gate still accounts for every finding. The limit is there
      for the pathological PR; a review that buries the diff is a review teams
      switch off.
    required: false
    default: "50"
  gate:
    description: >-
      Fail the job on HIGH or CRITICAL findings. Default false (advisory).
      MEDIUM and LOW still post as comments either way.
    required: false
    default: "false"
  dry-run:
    description: "Print the plan and exit without calling the AI."
    required: false
    default: "false"
  pr-number:
    description: >-
      PR number. Defaults to the pull_request event's number. On any other
      event (workflow_dispatch, schedule, issue_comment) set this AND base-ref;
      neither is derivable from the payload there.
    required: false
    default: ""
  base-ref:
    description: >-
      Base branch to diff against, e.g. main. Defaults to the pull_request
      event's base ref. Required when pr-number is set on a non-pull_request
      event. Check the PR head out yourself in that case (refs/pull/<n>/head)
      so the diff has a head to compare.
    required: false
    default: ""

  # ── Compliance profile ────────────────────────────────────────────────────
  profile:
    description: >-
      Ordered list of rubric sources, starting with `base` (the shared
      framework-neutral floor) or `none` (no floor — your profile supplies the
      whole rubric). Then any profile names under the engine's skills/profiles/
      or paths to custom profile directories: `base`, `base,cms-ars-5.1`,
      `base,cms-ars-5.1,pci-dss-4.0`, `none,my-agency-everything`. Sources layer in
      order and the last listed wins a conflict; a source only ever adds to
      what is above it. The first entry must be `base` or `none`, so the floor
      cannot be dropped by accident.
    required: false
    default: "base"

  # ── LLM endpoint ──────────────────────────────────────────────────────────
  provider:
    description: >-
      LLM endpoint: api | bedrock | vertex | azure. bedrock: claude or codex
      (codex uses its native amazon-bedrock provider); vertex: claude only;
      azure: codex only. copilot uses BYOK inputs on the api path.
    required: false
    default: "api"
  model:
    description: >-
      Model override. For provider=bedrock, the Bedrock model ID (required for
      ai-tool=codex); for provider=azure, the Azure deployment name.
    required: false
    default: ""
  aws-region:
    description: "AWS region for provider=bedrock (else taken from the AWS env)."
    required: false
    default: ""
  vertex-project-id:
    description: "GCP project ID for provider=vertex."
    required: false
    default: ""
  vertex-region:
    description: "Vertex region for provider=vertex (e.g. us-east5)."
    required: false
    default: ""
  azure-openai-endpoint:
    description: "Azure OpenAI resource endpoint for provider=azure (e.g. https://my-resource.openai.azure.com)."
    required: false
    default: ""
  azure-openai-api-key:
    description: "Azure OpenAI API key for provider=azure (ai-tool=codex)."
    required: false
    default: ""
  azure-openai-api-version:
    description: "Azure OpenAI REST API version for provider=azure (default 2024-10-21)."
    required: false
    default: ""
  anthropic-base-url:
    description: "Custom Anthropic-compatible endpoint (gateway/proxy)."
    required: false
    default: ""
  openai-base-url:
    description: "Custom OpenAI-compatible endpoint (gateway/proxy)."
    required: false
    default: ""

  # ── Copilot BYOK (ai-tool=copilot) ──────────────────────────────────────────
  # The copilot CLI talks directly to this endpoint. For Bedrock, point it at an
  # in-boundary Anthropic/OpenAI-compatible gateway (copilot has no native
  # Bedrock type).
  copilot-provider-base-url:
    description: "BYOK endpoint for ai-tool=copilot (COPILOT_PROVIDER_BASE_URL)."
    required: false
    default: ""
  copilot-provider-type:
    description: "BYOK provider type for ai-tool=copilot: openai | azure | anthropic."
    required: false
    default: ""
  copilot-provider-api-key:
    description: "BYOK model API key for ai-tool=copilot (COPILOT_PROVIDER_API_KEY)."
    required: false
    default: ""
  copilot-model:
    description: "BYOK model id for ai-tool=copilot (COPILOT_MODEL); else use 'model'."
    required: false
    default: ""

  # ── Adjudication and fan-out ────────────────────────────────────────────────
  adjudication:
    description: >-
      False-positive reduction: off (default) | self | independent. Off because
      a current model already verifies its own work, so instructing it to costs
      tokens without reducing findings — measured on the detection corpus. Turn
      on self or independent if your model or tool is older, or if you measure a
      benefit on your own code.
    required: false
    default: "off"
  adjudication-model:
    description: "Model for the independent adjudication pass only."
    required: false
    default: ""
  jobs:
    description: "Concurrent fan-out workers for large diffs (default 4)."
    required: false
    default: "4"
  batch-by:
    description: "Fan-out batching key: dir (default) | file."
    required: false
    default: "dir"
  batch-min-files:
    description: "Minimum changed files before fanning out (default 10)."
    required: false
    default: "10"
  context-budget:
    description: "Ceiling on context files loaded per AI call (default 15)."
    required: false
    default: "15"

  # ── AI CLI installation ─────────────────────────────────────────────────────
  install-cli:
    description: "npm-install the chosen AI CLI on the runner (default true; set false if pre-baked)."
    required: false
    default: "true"
  cli-version:
    description: >-
      npm version of the AI CLI to install. Defaults to a version pinned in
      this action — an agentic CLI that reads untrusted PR content should not
      float. Set an exact version to override, or `latest` to opt back into
      floating (logged as a warning).
    required: false
    default: ""

outputs:
  result:
    description: "APPROVE | COMMENT | REQUEST_CHANGES."
    value: ${{ steps.result.outputs.result }}
  review-json:
    description: "Path to the findings JSON written by the review."
    value: ${{ steps.review.outputs.review-json }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        AI_TOOL: ${{ inputs.ai-tool }}
        PROVIDER: ${{ inputs.provider }}
      run: |
        set -euo pipefail
        source "$(cd "${ACTION_PATH}/../_shared/lib" && pwd)/ci.sh"
        ci::validate_inputs

    - name: Resolve PR context
      id: ctx
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_REF_INPUT: ${{ inputs.base-ref }}
        EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        EVENT_NAME: ${{ github.event_name }}
        IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      run: |
        set -euo pipefail
        source "$(cd "${ACTION_PATH}/../_shared/lib" && pwd)/ci.sh"
        ci::resolve_pr_context

    # Fetching the base ref is a TRUSTED read — no AI runs here — so this step
    # may hold the SCM token. It needs one on a private repository, especially
    # when the checkout used `persist-credentials: false` (which docs/security.md
    # recommends, and which removes the credential this fetch would inherit).
    # The token is scoped to this step only; the AI step below still has none.
    - name: Ensure base ref is available for the diff
      if: steps.ctx.outputs.skip == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE: ${{ steps.ctx.outputs.base }}
        BASE_REF_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        source "$(cd "${ACTION_PATH}/../_shared/lib" && pwd)/ci.sh"
        ci::ensure_base_ref

    - name: Install AI CLI
      if: steps.ctx.outputs.skip == 'false' && inputs.install-cli == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        AI_TOOL: ${{ inputs.ai-tool }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        source "$(cd "${ACTION_PATH}/../_shared/lib" && pwd)/ci.sh"
        ci::install_ai_cli

    # ── AI phase — runs the review with NO SCM token in scope ────────────────
    # The AI CLI reads untrusted PR content, so the token that can write to your
    # repo is deliberately absent from this step's environment (and thus from
    # the CLI's process tree). Posting happens in the separate step below, which
    # is the only place the token exists. Exception: ai-tool=copilot, whose
    # model auth *is* a GitHub token, so it receives one here.
    - name: AI review
      id: review
      if: steps.ctx.outputs.skip == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE: ${{ steps.ctx.outputs.base }}
        DRY_RUN: ${{ inputs.dry-run }}
        AI_REVIEW_TOOL: ${{ inputs.ai-tool }}
        AI_REVIEW_PROVIDER: ${{ inputs.provider }}
        AI_REVIEW_PROFILE: ${{ inputs.profile }}
        AI_REVIEW_MODEL: ${{ inputs.model }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        AWS_REGION: ${{ inputs.aws-region }}
        ANTHROPIC_VERTEX_PROJECT_ID: ${{ inputs.vertex-project-id }}
        CLOUD_ML_REGION: ${{ inputs.vertex-region }}
        AZURE_OPENAI_ENDPOINT: ${{ inputs.azure-openai-endpoint }}
        AZURE_OPENAI_API_KEY: ${{ inputs.azure-openai-api-key }}
        AZURE_OPENAI_API_VERSION: ${{ inputs.azure-openai-api-version }}
        # copilot BYOK — read directly by the copilot CLI (model auth, not SCM).
        COPILOT_PROVIDER_BASE_URL: ${{ inputs.copilot-provider-base-url }}
        COPILOT_PROVIDER_TYPE: ${{ inputs.copilot-provider-type }}
        COPILOT_PROVIDER_API_KEY: ${{ inputs.copilot-provider-api-key }}
        COPILOT_MODEL: ${{ inputs.copilot-model }}
        AI_ADJUDICATION: ${{ inputs.adjudication }}
        AI_ADJUDICATION_MODEL: ${{ inputs.adjudication-model }}
        AI_REVIEW_JOBS: ${{ inputs.jobs }}
        AI_REVIEW_BATCH_BY: ${{ inputs.batch-by }}
        AI_REVIEW_BATCH_MIN_FILES: ${{ inputs.batch-min-files }}
        AI_REVIEW_CONTEXT_BUDGET: ${{ inputs.context-budget }}
        # Copilot only: its model credential is a GitHub token. Every other
        # tool runs with no SCM token in scope.
        GITHUB_TOKEN: ${{ inputs.ai-tool == 'copilot' && inputs.github-token || '' }}
        GH_TOKEN: ${{ inputs.ai-tool == 'copilot' && inputs.github-token || '' }}
        CI: "true"
      run: |
        set -euo pipefail
        engine="$(cd "${ACTION_PATH}/../.." && pwd)/engines/security-compliance-review/harness/ai-security-compliance-review"
        review_json="${RUNNER_TEMP:-/tmp}/ai-review-findings.json"
        echo "review-json=${review_json}" >> "${GITHUB_OUTPUT}"

        args=(--against "origin/${BASE}" --json-out "${review_json}")
        [[ "${DRY_RUN}" == "true" ]] && args+=(--dry-run)

        bash "${engine}" "${args[@]}"

    # ── Post phase — the only step that holds the SCM token ──────────────────
    - name: Post review
      if: steps.ctx.outputs.skip == 'false' && inputs.post-comments == 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr }}
        REVIEW_JSON: ${{ steps.review.outputs.review-json }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        AI_REVIEW_MAX_COMMENTS: ${{ inputs.max-comments }}
        AI_REVIEW_POST_WHEN_CLEAN: ${{ inputs.post-when-clean }}
        CI: "true"
      run: |
        set -euo pipefail
        engine="$(cd "${ACTION_PATH}/../.." && pwd)/engines/security-compliance-review/harness/ai-security-compliance-review"
        bash "${engine}" --post-only --pr "${PR_NUMBER}" --json-in "${REVIEW_JSON}"

    # ── Result + gate ────────────────────────────────────────────────────────
    - name: Result and gate
      id: result
      if: steps.ctx.outputs.skip == 'false' && inputs.dry-run != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        REVIEW_JSON: ${{ steps.review.outputs.review-json }}
        GATE: ${{ inputs.gate }}
      run: |
        set -euo pipefail
        source "$(cd "${ACTION_PATH}/../_shared/lib" && pwd)/ci.sh"
        ci::gate_result
