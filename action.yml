name: "AI PR Review"
description: >-
  AI-assisted security and compliance review of a pull request. Supports
  Claude, Codex, and Copilot, on the public API or a private endpoint
  (Bedrock, Vertex, Azure OpenAI, or a custom gateway).
author: "Nava PBC"

branding:
  icon: "shield"
  color: "purple"

inputs:
  ai-tool:
    description: "Which AI CLI to use: claude | codex | copilot."
    required: false
    default: "claude"
  anthropic-api-key:
    description: "Anthropic API key (ai-tool=claude, provider=api)."
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API key (ai-tool=codex)."
    required: false
    default: ""
  github-token:
    description: >-
      Token used to post the review. Needs 'pull-requests: write'. Defaults to
      the workflow token.
    required: false
    default: ${{ github.token }}

  post-comments:
    description: "Post the review with inline comments to the PR."
    required: false
    default: "true"
  gate:
    description: "Fail the job (exit 1) on any non-APPROVE result. Default: advisory."
    required: false
    default: "false"
  dry-run:
    description: "Print the plan and exit without calling the AI."
    required: false
    default: "false"
  pr-number:
    description: "PR number. Defaults to the pull_request event's number."
    required: false
    default: ""

  # ── LLM endpoint ──────────────────────────────────────────────────────────
  provider:
    description: >-
      LLM endpoint: api | bedrock | vertex | azure. bedrock/vertex are
      claude-only; azure is codex-only (Azure OpenAI serves OpenAI models).
    required: false
    default: "api"
  model:
    description: >-
      Model override. For provider=bedrock, the Bedrock model ID; for
      provider=azure, the Azure deployment name.
    required: false
    default: ""
  aws-region:
    description: "AWS region for provider=bedrock (else taken from the AWS env)."
    required: false
    default: ""
  vertex-project-id:
    description: "GCP project ID for provider=vertex."
    required: false
    default: ""
  vertex-region:
    description: "Vertex region for provider=vertex (e.g. us-east5)."
    required: false
    default: ""
  azure-openai-endpoint:
    description: "Azure OpenAI resource endpoint for provider=azure (e.g. https://my-resource.openai.azure.com)."
    required: false
    default: ""
  azure-openai-api-key:
    description: "Azure OpenAI API key for provider=azure (ai-tool=codex)."
    required: false
    default: ""
  azure-openai-api-version:
    description: "Azure OpenAI REST API version for provider=azure (default 2024-10-21)."
    required: false
    default: ""
  anthropic-base-url:
    description: "Custom Anthropic-compatible endpoint (gateway/proxy)."
    required: false
    default: ""
  openai-base-url:
    description: "Custom OpenAI-compatible endpoint (gateway/proxy)."
    required: false
    default: ""

  # ── Adjudication and fan-out ────────────────────────────────────────────────
  adjudication:
    description: "False-positive reduction: self (default) | independent | off."
    required: false
    default: "self"
  adjudication-model:
    description: "Model for the independent adjudication pass only."
    required: false
    default: ""
  jobs:
    description: "Concurrent fan-out workers for large diffs (default 4)."
    required: false
    default: "4"
  batch-by:
    description: "Fan-out batching key: dir (default) | file."
    required: false
    default: "dir"
  batch-min-files:
    description: "Minimum changed files before fanning out (default 10)."
    required: false
    default: "10"
  context-budget:
    description: "Ceiling on context files loaded per AI call (default 15)."
    required: false
    default: "15"

  # ── AI CLI installation ─────────────────────────────────────────────────────
  install-cli:
    description: "npm-install the chosen AI CLI on the runner (default true; set false if pre-baked)."
    required: false
    default: "true"
  cli-version:
    description: "npm version of the AI CLI to install."
    required: false
    default: "latest"

outputs:
  result:
    description: "APPROVE | COMMENT | REQUEST_CHANGES."
    value: ${{ steps.result.outputs.result }}
  review-json:
    description: "Path to the findings JSON written by the review."
    value: ${{ steps.review.outputs.review-json }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        AI_TOOL: ${{ inputs.ai-tool }}
        PROVIDER: ${{ inputs.provider }}
      run: |
        set -euo pipefail
        case "${AI_TOOL}" in
          claude | codex | copilot) ;;
          *) echo "::error::ai-tool must be claude | codex | copilot (got '${AI_TOOL}')"; exit 1 ;;
        esac
        case "${PROVIDER}" in
          api | bedrock | vertex | azure) ;;
          *) echo "::error::provider must be api | bedrock | vertex | azure (got '${PROVIDER}')"; exit 1 ;;
        esac
        case "${PROVIDER}" in
          bedrock | vertex)
            if [[ "${AI_TOOL}" != "claude" ]]; then
              echo "::error::provider=${PROVIDER} is only supported with ai-tool=claude"; exit 1
            fi ;;
          azure)
            if [[ "${AI_TOOL}" != "codex" ]]; then
              echo "::error::provider=azure is only supported with ai-tool=codex (Azure OpenAI serves OpenAI models)"; exit 1
            fi ;;
        esac

    - name: Resolve PR context
      id: ctx
      shell: bash
      env:
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        set -euo pipefail
        pr="${PR_NUMBER_INPUT:-${EVENT_PR_NUMBER:-}}"
        base="${EVENT_BASE_REF:-}"
        if [[ -z "${pr}" ]]; then
          echo "::notice::No PR context (not a pull_request event and no pr-number given). Skipping review."
          echo "skip=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if [[ -z "${base}" ]]; then
          echo "::error::Could not determine the PR base ref. On non-pull_request events, run on a PR or provide the base via checkout."
          exit 1
        fi
        {
          echo "skip=false"
          echo "pr=${pr}"
          echo "base=${base}"
        } >> "${GITHUB_OUTPUT}"

    - name: Ensure base ref is available for the diff
      if: steps.ctx.outputs.skip == 'false'
      shell: bash
      env:
        BASE: ${{ steps.ctx.outputs.base }}
      run: |
        set -euo pipefail
        # actions/checkout fetches the PR head; make origin/<base> resolvable
        # locally for `git diff`. Consumers who set fetch-depth: 0 already have it.
        git fetch --no-tags --depth=200 origin "${BASE}:refs/remotes/origin/${BASE}" 2>/dev/null || true

    - name: Install AI CLI
      if: steps.ctx.outputs.skip == 'false' && inputs.install-cli == 'true'
      shell: bash
      env:
        AI_TOOL: ${{ inputs.ai-tool }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        case "${AI_TOOL}" in
          claude)  npm install -g "@anthropic-ai/claude-code@${CLI_VERSION}" ;;
          codex)   npm install -g "@openai/codex@${CLI_VERSION}" ;;
          copilot) npm install -g "@github/copilot@${CLI_VERSION}" ;;
        esac

    # ── AI phase — runs the review with NO SCM token in scope ────────────────
    # The AI CLI reads untrusted PR content, so the token that can write to your
    # repo is deliberately absent from this step's environment (and thus from
    # the CLI's process tree). Posting happens in the separate step below, which
    # is the only place the token exists. Exception: ai-tool=copilot, whose
    # model auth *is* a GitHub token, so it receives one here.
    - name: AI review
      id: review
      if: steps.ctx.outputs.skip == 'false'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE: ${{ steps.ctx.outputs.base }}
        DRY_RUN: ${{ inputs.dry-run }}
        AI_REVIEW_TOOL: ${{ inputs.ai-tool }}
        AI_REVIEW_PROVIDER: ${{ inputs.provider }}
        AI_REVIEW_MODEL: ${{ inputs.model }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
        OPENAI_BASE_URL: ${{ inputs.openai-base-url }}
        AWS_REGION: ${{ inputs.aws-region }}
        ANTHROPIC_VERTEX_PROJECT_ID: ${{ inputs.vertex-project-id }}
        CLOUD_ML_REGION: ${{ inputs.vertex-region }}
        AZURE_OPENAI_ENDPOINT: ${{ inputs.azure-openai-endpoint }}
        AZURE_OPENAI_API_KEY: ${{ inputs.azure-openai-api-key }}
        AZURE_OPENAI_API_VERSION: ${{ inputs.azure-openai-api-version }}
        AI_ADJUDICATION: ${{ inputs.adjudication }}
        AI_ADJUDICATION_MODEL: ${{ inputs.adjudication-model }}
        AI_REVIEW_JOBS: ${{ inputs.jobs }}
        AI_REVIEW_BATCH_BY: ${{ inputs.batch-by }}
        AI_REVIEW_BATCH_MIN_FILES: ${{ inputs.batch-min-files }}
        AI_REVIEW_CONTEXT_BUDGET: ${{ inputs.context-budget }}
        # Copilot only: its model credential is a GitHub token. Every other
        # tool runs with no SCM token in scope.
        GITHUB_TOKEN: ${{ inputs.ai-tool == 'copilot' && inputs.github-token || '' }}
        GH_TOKEN: ${{ inputs.ai-tool == 'copilot' && inputs.github-token || '' }}
        CI: "true"
      run: |
        set -euo pipefail
        review_json="${RUNNER_TEMP:-/tmp}/ai-review-findings.json"
        echo "review-json=${review_json}" >> "${GITHUB_OUTPUT}"

        args=(--against "origin/${BASE}" --json-out "${review_json}")
        [[ "${DRY_RUN}" == "true" ]] && args+=(--dry-run)

        bash "${ACTION_PATH}/engine/bin/ai-pr-review" "${args[@]}"

    # ── Post phase — the only step that holds the SCM token ──────────────────
    - name: Post review
      if: steps.ctx.outputs.skip == 'false' && inputs.post-comments == 'true' && inputs.dry-run != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr }}
        REVIEW_JSON: ${{ steps.review.outputs.review-json }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        CI: "true"
      run: |
        set -euo pipefail
        bash "${ACTION_PATH}/engine/bin/ai-pr-review" \
          --post-only --pr "${PR_NUMBER}" --json-in "${REVIEW_JSON}"

    # ── Result + gate ────────────────────────────────────────────────────────
    - name: Result and gate
      id: result
      if: steps.ctx.outputs.skip == 'false' && inputs.dry-run != 'true'
      shell: bash
      env:
        REVIEW_JSON: ${{ steps.review.outputs.review-json }}
        GATE: ${{ inputs.gate }}
      run: |
        set -euo pipefail
        [[ -f "${REVIEW_JSON}" ]] || exit 0
        result="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["review_action"])' "${REVIEW_JSON}")"
        echo "result=${result}" >> "${GITHUB_OUTPUT}"
        echo "[ai-pr-review] result: ${result}"
        if [[ "${GATE}" == "true" && "${result}" != "APPROVE" ]]; then
          echo "::error::AI review result is ${result} and gate is enabled."
          exit 1
        fi
