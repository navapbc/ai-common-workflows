# Secret-scanning exclusions.
#
# This repository is a security reviewer, so it necessarily CONTAINS
# credential-shaped strings: the detection corpus and the test fixtures exist
# to hand the reviewer something that looks like a leaked secret and check that
# it says so. Those trip secret scanning on every push, and an alert stream
# that is always noise is one people stop reading — which is the failure mode
# that matters, because the next alert might be real.
#
# Scoped as narrowly as the fixtures allow. Everything listed here is test
# DATA, never code that runs in a consumer's pipeline. Deliberately NOT
# excluded: engines/, workflows/, docs/ and CHANGELOG.md. Those mention AWS's
# published example key in prose, and a one-off dismissal there is cheaper than
# a blind spot in the tree that ships.
#
# The cost is real and worth naming: a credential accidentally pasted into one
# of these paths would not be caught here. tests/python/test_secret_fixtures.py
# is the compensating control — it fails when a credential-shaped literal
# appears anywhere outside these paths, and when a path listed here no longer
# needs to be.
paths-ignore:
  # Detection corpus. Case 01 must look like a LIVE key or the reviewer
  # correctly rates it low, which is the bug that case was fixed for
  # (tests/corpus/01-hardcoded-aws-key/case.md). Case 09 holds AWS's published
  # documentation pair on purpose, to assert it is NOT cried wolf over.
  - "tests/corpus/**"

  # Recorded AI responses replayed by the bats suite, including adjudication
  # transcripts that quote the key they dismissed.
  - "tests/fixtures/**"

  # bats tests build throwaway repos containing a fake secret so the engine has
  # something to find. AWS's documented example pair, inline.
  - "tests/bats/**"
