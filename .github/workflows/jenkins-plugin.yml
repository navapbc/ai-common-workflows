name: Jenkins plugin

on:
  push:
    branches: [main]
    paths:
      - "jenkins-plugin/**"
      - "engine/**"
      - ".github/workflows/jenkins-plugin.yml"
    tags:
      - "jenkins-plugin-v*"
  pull_request:
    paths:
      - "jenkins-plugin/**"
      - "engine/**"
      - ".github/workflows/jenkins-plugin.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn verify
        working-directory: jenkins-plugin
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: ai-security-compliance-review-hpi
          # Both .hpi files: the workflow plugin and the shared core it depends on.
          path: |
            jenkins-plugin/security-compliance-review/target/ai-security-compliance-review.hpi
            jenkins-plugin/core/target/ai-common-core.hpi

  release:
    name: Attach .hpi to the release
    if: startsWith(github.ref, 'refs/tags/jenkins-plugin-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build release .hpi
        working-directory: jenkins-plugin
        run: |
          version="${GITHUB_REF_NAME#jenkins-plugin-v}"
          mvn -B -ntp -Drevision="${version}" -Dchangelist= -DskipTests=false package
      - name: Checksum
        run: |
          for hpi in \
            jenkins-plugin/security-compliance-review/target/ai-security-compliance-review.hpi \
            jenkins-plugin/core/target/ai-common-core.hpi; do
            (cd "$(dirname "$hpi")" && sha256sum "$(basename "$hpi")" | tee "$(basename "$hpi").sha256")
          done
      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ship the workflow plugin AND the shared core plugin it depends on,
          # each with its checksum. Both must be installed on the controller.
          assets=(
            jenkins-plugin/security-compliance-review/target/ai-security-compliance-review.hpi
            jenkins-plugin/security-compliance-review/target/ai-security-compliance-review.hpi.sha256
            jenkins-plugin/core/target/ai-common-core.hpi
            jenkins-plugin/core/target/ai-common-core.hpi.sha256
          )
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "AI Security & Compliance Review Jenkins plugin ${GITHUB_REF_NAME#jenkins-plugin-v}. Install both ai-security-compliance-review.hpi and its dependency ai-common-core.hpi; verify each against its .sha256 before installing." \
            || gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
