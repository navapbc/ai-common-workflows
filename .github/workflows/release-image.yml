name: Review image

on:
  push:
    tags:
      - "v*"
    branches: [main]
    paths:
      - "engine/**"
      - "Dockerfile"
      - ".github/workflows/release-image.yml"
  pull_request:
    paths:
      - "engine/**"
      - "Dockerfile"
      - ".github/workflows/release-image.yml"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/ai-pr-review

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "${IMAGE}:ci" .

      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Publish only on a version tag (not on PRs). The digest is what
      # consumers pin to; surface it in the job summary and release notes.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag + digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "${IMAGE}:ci" "${IMAGE}:${version}"
          docker push "${IMAGE}:${version}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${version}" || true)"
          {
            echo "Published \`${IMAGE}:${version}\`"
            echo "Digest: \`${digest}\`"
            echo "Pin the action's review-image input to this digest."
          } >> "${GITHUB_STEP_SUMMARY}"
