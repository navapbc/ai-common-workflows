# .github/workflows/release.yml
#
# This workflow releases the GitHub action. A `vX.Y.Z` tag starts it. The
# workflow then does two things:
#
#   1. It makes the GitHub release for that version. The version does not change.
#   2. It moves the `vX` alias tag to the same commit.
#
# GitHub actions use these two tag types, for example `actions/checkout@v4`.
# The two types give each consumer the correct reference:
#
#   - A consumer with high security requirements pins a 40-character SHA or a
#     `vX.Y.Z` tag. This workflow does not move these references. The consumer
#     controls each update. Refer to docs/security.md.
#   - A pilot consumer pins `@vX`. New releases come automatically. The consumer
#     does the installation one time only.
#
# The `vX` alias moves. This is intentional. You must protect the `v*` tags with
# a ruleset. The ruleset must permit this workflow to move `vX`. It must prevent
# the deletion of `vX.Y.Z`. Refer to docs/releasing.md.
#
# How to make a release:
#   git tag -s v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# The `-s` flag signs the tag. A signed tag shows who made the release.

name: Release action

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # prereleases: v1.1.0-rc.1

permissions:
  contents: read

concurrency:
  group: release-action-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release and move the major alias
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; force-move the vX tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag can point to a commit that is not on main. Such a commit is not
      # reviewed. Do not release it. Stop the workflow instead.
      - name: Verify the tag is an ancestor of main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not an ancestor of main. Tag a merged commit."
            exit 1
          fi

      # The action calls the engine. The action finds the engine with the paths
      # that action.yml calculates from ${{ github.action_path }}. If a file is
      # absent, the consumer job fails while it runs. Find the error here first.
      - name: Verify the consumer-facing surface is complete
        run: |
          set -euo pipefail
          required=(
            workflows/security-compliance-review/action.yml
            workflows/test-classifier/action.yml
            workflows/_shared/lib/ci.sh
            engines/_common/harness/core.sh
            engines/security-compliance-review/harness/ai-pr-review
            engines/test-classifier/harness/ai-test-classifier
          )
          missing=0
          for path in "${required[@]}"; do
            if [[ ! -e "${path}" ]]; then
              echo "::error::missing from the release tree: ${path}"
              missing=1
            fi
          done
          ((missing == 0)) || exit 1
          for entrypoint in \
            engines/security-compliance-review/harness/ai-pr-review \
            engines/test-classifier/harness/ai-test-classifier; do
            [[ -x "${entrypoint}" ]] || echo "::warning::${entrypoint} is not executable (the actions invoke it via \`bash\`, so this is not fatal)"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          major="${version%%.*}"
          prerelease=()
          [[ "${version}" == *-* ]] && prerelease=(--prerelease)

          # Use printf, and do not use a here-document. In this YAML block, a
          # here-document keeps the spaces at the start of each line. Markdown
          # shows a line with four or more initial spaces as a code block.
          notes_file="${RUNNER_TEMP}/notes.md"
          {
            # shellcheck disable=SC2016  # literal markdown backticks, not command substitution
            printf 'Pin the action to the commit SHA below. Or use `@%s` to get each new %s.x release automatically.\n\n' "${major}" "${major}"
            printf '```yaml\n'
            printf -- '- uses: %s/workflows/test-classifier@%s # %s\n' "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${version}"
            printf -- '- uses: %s/workflows/security-compliance-review@%s # %s\n' "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${version}"
            printf '```\n\n'
            # shellcheck disable=SC2016  # literal markdown backticks, not command substitution
            printf 'The `@%s` alias points to the newest stable %s.x release. The `%s` tag does not move.\n' "${major}" "${major}" "${version}"
            printf 'Refer to [docs/security.md](https://github.com/%s/blob/%s/docs/security.md) to select a reference.\n' "${GITHUB_REPOSITORY}" "${version}"
          } >"${notes_file}"

          gh release create "${version}" \
            --title "${version}" \
            --notes-file "${notes_file}" \
            --generate-notes \
            "${prerelease[@]+"${prerelease[@]}"}"

      # A pre-release must not move the alias. The `@v1` alias must always point
      # to the newest stable 1.x release.
      - name: Move the major alias
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
          echo "Moved ${major} -> ${GITHUB_SHA} (${GITHUB_REF_NAME})"
